<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración para asegurar el zoom al 100% y adaptabilidad móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportAdmin - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-container">
        <!-- Encabezado Institucional -->
        <header class="header">
            <img src="logo SportAdmin.jpg" alt="Logo SportAdmin" class="logo">
            <h2>Iniciar Sesión</h2>
            <p>Valida tu identidad para acceder</p>
        </header>

        <!-- Formulario de Autenticación -->
        <form action="dashboard.html" method="POST">
            <div class="form-group">
                <label for="username">Nombre de usuario (*)</label>
                <input type="text" id="username" class="input-box" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña (*)</label>
                <input type="password" id="password" class="input-box" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">INGRESAR</button>
        </form>

        <!-- Enlaces de recuperación y registro -->
        <div class="form-footer-links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="Registro_paso_1.html">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>

</body>
</html>
